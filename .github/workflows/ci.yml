name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore and build backend
        working-directory: PetitionService.Server
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      - name: Run backend tests
        run: |
          dotnet test PetitionService.Server.Tests/PetitionService.Server.Tests.csproj -c Release --no-build

      - name: Install frontend deps
        working-directory: petitionservice.client
        run: |
          npm ci

      - name: Lint frontend
        working-directory: petitionservice.client
        run: |
          npm run lint

      - name: Run frontend tests
        working-directory: petitionservice.client
        run: |
          npm run test:run

      - name: Build frontend
        working-directory: petitionservice.client
        run: |
          npm run build

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    env:
      REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
      IMAGE_NAMESPACE: ${{ secrets.DOCKER_NAMESPACE || secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/petition-backend:$(echo $GITHUB_SHA | cut -c1-8)
          docker build -t $IMAGE -f PetitionService.Server/Dockerfile .
          docker push $IMAGE
        shell: bash

      - name: Build and push frontend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/petition-frontend:$(echo $GITHUB_SHA | cut -c1-8)
          docker build -t $IMAGE -f petitionservice.client/Dockerfile.prod ./petitionservice.client
          docker push $IMAGE
        shell: bash
